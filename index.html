을 중심으로 실사용자 관점의 자연스럽고 정보성 있는 후기 콘텐츠를 작성합니다.\u003cbr>단순히 짐보관 서비스를 소개하는 것에 그치지 않고, 실제 오사카 여행 일정 속에서 짐보관 서비스를 어떻게 활용했는지도 함께 작성해주세요!\u003c/p>\u003c/div>\n\u003cnav class=\"toc\">\u003ca href=\"#s1\">1. 작성 조건\u003c/a>\u003ca href=\"#s2\">2. 작성 방향\u003c/a>\u003ca href=\"#s3\">3. 필수 포함 내용\u003c/a>\u003ca href=\"#s4\">4. 카페 할인\u003c/a>\u003ca href=\"#s5\">5. 필수 키워드\u003c/a>\u003ca href=\"#s6\">6. 공정위 이미지\u003c/a>\u003ca href=\"#s7\">7. 유의사항\u003c/a>\u003c/nav>\u003csection id=\"s1\">\u003cdiv class=\"section-head\">\u003cspan class=\"num\">01\u003c/span>\u003ch2>콘텐츠 작성 조건\u003c/h2>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>항목\u003c/th>\u003cth>필수 기준\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>본문 글자 수\u003c/td>\u003ctd>\u003cstrong>2,000자 이상\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>직접 촬영 사진\u003c/td>\u003ctd>\u003cstrong>20장 이상\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>제목 키워드\u003c/td>\u003ctd>필수 키워드 \u003cstrong>1개 이상\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>본문 키워드\u003c/td>\u003ctd>서브 키워드 \u003cstrong>2개 이상\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>콘텐츠 형식\u003c/td>\u003ctd>체험 후기 + 여행 정보형\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cstrong>사진 필수 포함\u003c/strong>\u003cp>센터 외관 · 내부 시설 · 짐 맡기는 과정 · 캐리어 · 화이트패스 · 렌탈 상품(USJ 렌탈 제외) · POP 및 안내판\u003c/p>\u003c/div>\u003c/section>\u003csection id=\"s2\">\u003cdiv class=\"section-head\">\u003cspan class=\"num\">02\u003c/span>\u003ch2>콘텐츠 작성 방향\u003c/h2>\u003c/div>\u003cp>\u003cstrong>단순 서비스 소개가 아닌 실제 여행 동선과 함께 작성해주세요.\u003c/strong> 플라잉재팬의 위치와 이용 방법뿐 아니라 오사카 여행 중 짐보관 서비스를 어떻게 활용할 수 있는지 자연스럽게 보여주세요.\u003c/p>\u003ch3>1) 짐보관 서비스 소개형\u003c/h3>\u003cp>플라잉재팬 여행자센터의 짐보관 서비스를 직접 이용한 경험을 중심으로 작성해주세요.\u003c/p>\u003ch4>포함하면 좋은 내용\u003c/h4>\u003cul>\u003cli>플라잉재팬 여행자센터 위치\u003c/li>\u003cli>짐보관 이용 방법\u003c/li>\u003cli>짐보관 과정 및 이용 후기\u003c/li>\u003cli>중간 재방문 가능 등 서비스 특징\u003c/li>\u003cli>센터 내부 시설 및 편의성\u003c/li>\u003cli>화이트패스 및 관련 혜택\u003c/li>\u003cli>센터 내 진행 중인 이벤트 소개\u003c/li>\u003c/ul>\u003ch3>2) 여행 동선 활용형\u003c/h3>\u003cp>실제 오사카 여행 일정 과정에서 짐보관 서비스를 어떻게 활용했는지 자연스럽게 보여주세요.\u003c/p>\u003cul>\u003cli>호텔 체크인 전 캐리어를 맡기고 관광하기\u003c/li>\u003cli>호텔 체크아웃 후 캐리어를 맡기고 마지막 날 일정 즐기기\u003c/li>\u003cli>난바 도착 후 캐리어를 맡기고 도톤보리·신사이바시 등 관광하기\u003c/li>\u003cli>쇼핑 전 짐을 맡기고 가볍게 이동하기\u003c/li>\u003cli>여행 중 센터에 다시 방문하여 구매한 물건을 캐리어에 넣고 일정 이어가기\u003c/li>\u003c/ul>\u003cdiv class=\"note\">\u003cstrong>작성 핵심 포인트\u003c/strong>\u003cp>서비스 설명 → 실제 여행 상황 → 짐보관 이용 → 이후 여행 동선\u003c/p>\u003cp>서비스를 이용했다는 사실 자체보다, 이용하면서 실제 여행이 어떻게 편리해졌는지 드러나는 것이 중요합니다.\u003c/p>\u003c/div>\u003cdiv class=\"examples\">\u003cspan class=\"eyebrow\">작성 예시 · 실제 경험에 맞게 작성\u003c/span>\u003cp>“체크아웃 후 저녁 비행기까지 시간이 많이 남아 캐리어를 플라잉재팬에 맡긴 뒤 도톤보리와 신사이바시를 둘러봤어요. 무거운 캐리어 없이 마지막 날 일정을 보낼 수 있어서 훨씬 편했습니다.”\u003c/p>\u003cp>“난바에 도착한 뒤 호텔 체크인까지 시간이 남아서 먼저 캐리어를 맡겼어요. 짐 없이 주변을 돌아볼 수 있어서 첫날부터 여행 일정을 알차게 보낼 수 있었습니다.”\u003c/p>\u003cp>“쇼핑을 하다가 짐이 많아졌는데 중간에 다시 센터에 방문해 구매한 물건을 캐리어에 넣고 다시 여행을 이어갈 수 있어서 편리했어요.”\u003c/p>\u003c/div>\u003c/section>\u003csection id=\"s3\">\u003cdiv class=\"section-head\">\u003cspan class=\"num\">03\u003c/span>\u003ch2>필수 포함 내용\u003c/h2>\u003c/div>\u003ch3>1) 플라잉재팬 여행자센터 소개\u003c/h3>\u003ch4>위치\u003c/h4>\u003cul>\u003cli>오사카 에디온 난바 본점 1층\u003c/li>\u003cli>난카이 난바역 / 오사카메트로 난바역 기준 도보 약 2~3분\u003c/li>\u003cli>스타벅스 옆\u003c/li>\u003c/ul>\u003ch4>특징\u003c/h4>\u003cul>\u003cli>한국인 여행자를 위한 짐보관 · 렌탈 · 패스 발급 공간\u003c/li>\u003cli>한국인 직원 상주 - 일본어를 몰라도 한국어로 편하게 이용 가능\u003c/li>\u003cli>센터 내 리뷰 이벤트 진행으로 다양한 상품을 받을 수 있음\u003c/li>\u003c/ul>\u003cdiv class=\"examples\">\u003cspan class=\"eyebrow\">작성 예시 · 실제 경험에 맞게 작성\u003c/span>\u003cp>“난바역에서 도보 몇 분 거리라 캐리어를 끌고 이동하기 편했어요.”\u003c/p>\u003cp>“한국인 직원분이 상주하고 계셔서 일본어를 몰라도 전혀 불편하지 않았어요.”\u003c/p>\u003cp>“말이 안 통할까봐 걱정했는데 한국어로 친절하게 안내해주셔서 너무 편했습니다.”\u003c/p>\u003cp>“리뷰 쓰고 참여하면 일본 고급 양주도 받을 수 있는 뽑기 이벤트도 있었어요.”\u003c/p>\u003c/div>\u003ch3>2) 짐보관 서비스 이용 후기\u003c/h3>\u003cdiv class=\"note\">\u003cstrong>필수 사진\u003c/strong>\u003cp>센터 외관 · 내부 전경 · 카운터 · 짐 맡기는 장면 · 캐리어 보관 공간\u003c/p>\u003c/div>\u003ch4>이용 방법 · 필수\u003c/h4>\u003cdiv class=\"steps\">\u003cdiv class=\"step\">\u003cb>01\u003c/b>여행자센터 방문\u003c/div>\u003cdiv class=\"step\">\u003cb>02\u003c/b>QR코드 스캔\u003c/div>\u003cdiv class=\"step\">\u003cb>03\u003c/b>신청서 작성\u003c/div>\u003cdiv class=\"step\">\u003cb>04\u003c/b>성함 호출 (스태프가 직접 호출)\u003c/div>\u003cdiv class=\"step\">\u003cb>05\u003c/b>요금 결제\u003c/div>\u003cdiv class=\"step\">\u003cb>06\u003c/b>짐보관 진행\u003c/div>\u003cdiv class=\"step\">\u003cb>07\u003c/b>자유롭게 여행 (중간 재방문 가능)\u003c/div>\u003cdiv class=\"step\">\u003cb>08\u003c/b>짐 수령 (운영시간 내)\u003c/div>\u003c/div>\u003cp class=\"muted\">참고용 (블로그 포스팅 반영 X) · 짐보관 신청서 화면 참고 및 사진 촬영용: \u003ca href=\"https://luggage.flyingjp.com/\" rel=\"noopener\" target=\"_blank\">짐보관 신청서\u003c/a>\u003c/p>\u003cdiv class=\"note\">\u003cstrong>중요 포인트\u003c/strong>\u003cp>코인락커와 달리 중간에 다시 방문하여 캐리어를 열고 쇼핑한 물건을 넣거나 짐을 정리할 수 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"examples\">\u003cspan class=\"eyebrow\">작성 예시 · 실제 경험에 맞게 작성\u003c/span>\u003cp>“QR코드를 스캔하고 신청서를 작성하니 직원분이 이름을 불러주셨어요.”\u003c/p>\u003cp>“결제 후 바로 캐리어를 맡길 수 있었고 절차가 간단했습니다.”\u003c/p>\u003cp>“도톤보리 쇼핑 후 다시 방문해서 캐리어 정리를 할 수 있어 편했어요.”\u003c/p>\u003cp>“코인락커는 짐을 꺼내기 부담스러운데 이곳은 다시 맡길 수 있어 좋았습니다.”\u003c/p>\u003c/div>\u003ch3>3) 여행자센터 편의시설 소개\u003c/h3>\u003ch4>이용 가능한 편의시설\u003c/h4>\u003cp>충전 콘센트 · 케이블 / 스탠딩 테이블 / 캐리어 핸드저울 / 무료 우산 대여 / 할인쿠폰 / 다이슨·유모차 렌탈상품\u003c/p>\u003ch4>포함하면 좋은 내용\u003c/h4>\u003cp>청결도 · 직원 응대 · 내부 분위기 · 관광 동선 편리성\u003c/p>\u003cdiv class=\"examples\">\u003cspan class=\"eyebrow\">작성 예시 · 실제 경험에 맞게 작성\u003c/span>\u003cp>“짐을 맡기고 바로 도톤보리로 이동할 수 있어 동선이 좋았습니다.”\u003c/p>\u003cp>“에디온 안에 있어서 쇼핑과 함께 이용하기 편했습니다.”\u003c/p>\u003c/div>\u003ch3>4) 짐배송 서비스 소개\u003c/h3>\u003cp>플라잉재팬의 새롭게 시작된 짐배송 서비스를 블로그 본문에 반드시 소개해 주세요.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>서비스\u003c/th>\u003cth>접수 및 배송 기준 (원본 가이드 기준)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>호텔 당일 배송\u003c/td>\u003ctd>오사카·교토·고베 등 / 오전 11시 30분까지 접수\u003cbr>\u003cspan class=\"muted\">카운터·리셉션이 있는 숙박시설만 가능\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>간사이공항 익일 배송\u003c/td>\u003ctd>오전 11시 30분까지 접수\u003c/td>\u003c/tr>\u003ctr>\u003ctd>일본 전국 배송\u003c/td>\u003ctd>오후 5시까지 접수 (지역별 배송일 상이)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cstrong>작성 시 유의사항\u003c/strong>\u003cp>단순한 서비스 나열보다는 호텔 체크인·체크아웃, 공항 이동 등 실제 여행 상황과 연결해 자연스럽게 소개해주세요.\u003c/p>\u003cp class=\"muted\">※ 실제 배송 가능 지역은 접수 전 확인이 필요합니다.\u003c/p>\u003c/div>\u003ch3>5) 화이트패스 간단한 소개\u003c/h3>\u003cp>플라잉재팬 여행자센터 방문 시 \u003cstrong>무료로 발급 가능한 실물형 패스\u003c/strong>입니다.\u003c/p>\u003cul>\u003cli>패스 소지 시 제휴처에서 음료 · 토핑 · 할인 등 혜택 제공\u003c/li>\u003cli>난바 에디온 쇼핑 시 할인 및 쇼핑 영수증 제시 시 센터에서 캐시백 100엔 가능\u003c/li>\u003cli>직원이 안내하지 않은 경우 직접 발급 요청 및 카드 사진 촬영 부탁드립니다\u003c/li>\u003c/ul>\u003cdiv class=\"examples\">\u003cspan class=\"eyebrow\">작성 예시 · 실제 경험에 맞게 작성\u003c/span>\u003cp>“여행자센터에서 무료로 받은 화이트패스로 제휴 맛집에서 음료 토핑을 무료로 받았어요.”\u003c/p>\u003cp>“난바 에디온에서 쇼핑할 때도 화이트패스로 할인도 받고, 쇼핑 영수증 보여주니 캐시백 100엔도 받았어요.”\u003c/p>\u003c/div>\u003ch3>6) 위치 정보 · 필수 삽입\u003c/h3>\u003cp>블로그 본문 내 \u003cstrong>구글맵을 삽입\u003c/strong>해주세요.\u003c/p>\u003cp>플라잉재팬 여행자센터 · 오사카 에디온 난바 본점 1층 · 난바역 도보 2~3분\u003c/p>\u003cp class=\"muted\">Flying Japan Traveler Center Osaka Edion Namba Main\u003c/p>\u003cdiv class=\"links\">\u003ca href=\"https://maps.app.goo.gl/U6znG4JNz7UrQ4AG9\" rel=\"noopener\" target=\"_blank\">구글맵 위치 확인 ↗\u003c/a>\u003c/div>\u003ch3>7) 후기 및 마무리\u003c/h3>\u003cdiv class=\"examples\">\u003cspan class=\"eyebrow\">작성 예시 · 실제 경험에 맞게 작성\u003c/span>\u003cp>“체크아웃 후 캐리어 때문에 고민했는데 정말 편하게 이용했습니다.”\u003c/p>\u003cp>“난바역 근처에서 짐보관을 찾는다면 추천할 만한 곳입니다.”\u003c/p>\u003cp>“한국어로 이용할 수 있어서 더욱 편했습니다.”\u003c/p>\u003c/div>\u003c/section>\u003csection id=\"s4\">\u003cdiv class=\"section-head\">\u003cspan class=\"num\">04\u003c/span>\u003ch2>플라잉재팬 카페 등급별 짐보관 할인\u003c/h2>\u003c/div>\u003cp>\u003cspan class=\"pill\">본문 필수 포함\u003c/span>\u003c/p>\u003cp>아래 내용을 블로그 본문에 자연스럽게 녹여서 작성해주세요. 카페 가입 후 방문하면 이득이라는 점을 안내해주세요.\u003c/p>\u003cul>\u003cli>플라잉재팬 네이버 카페에 가입하면 블루 등급 달성 즉시 200엔 할인\u003c/li>\u003cli>가입부터 등업까지 약 3분이면 가능 - 방문 전에 미리 해두면 이득\u003c/li>\u003cli>등급이 높을수록 할인 폭도 커짐\u003c/li>\u003cli>블랙 등급은 무료\u003c/li>\u003c/ul>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>등급\u003c/th>\u003cth>본인 할인\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>블루\u003c/td>\u003ctd>\u003cstrong>200엔\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>실버\u003c/td>\u003ctd>\u003cstrong>300엔\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>골드\u003c/td>\u003ctd>\u003cstrong>400엔\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>플래티넘\u003c/td>\u003ctd>\u003cstrong>500엔\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>블랙\u003c/td>\u003ctd>\u003cstrong>무료\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"examples\">\u003cspan class=\"eyebrow\">작성 예시 · 실제 경험에 맞게 작성\u003c/span>\u003cp>“플라잉재팬 카페에 미리 가입하고 갔더니 짐보관 요금에서 200엔이 바로 할인됐어요!”\u003c/p>\u003cp>“3분이면 등업 가능하다길래 방문 전날 가입했는데 덕분에 할인받을 수 있었습니다.”\u003c/p>\u003cp>“카페 등급에 따라 할인 폭이 다르니 오사카 방문 전에 꼭 가입해두세요!”\u003c/p>\u003c/div>\u003cp>\u003cstrong>필수 삽입 · 카페 등급 안내 링크\u003c/strong>\u003c/p>\u003cdiv class=\"links\">\u003ca href=\"https://cafe.naver.com/d2d2d2/2171112\" rel=\"noopener\" target=\"_blank\">카페 등급 안내 확인 ↗\u003c/a>\u003c/div>\u003c/section>\u003csection id=\"s5\">\u003cdiv class=\"section-head\">\u003cspan class=\"num\">05\u003c/span>\u003ch2>필수 키워드\u003c/h2>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>구분\u003c/th>\u003cth>키워드\u003c/th>\u003cth>기준\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>제목\u003c/td>\u003ctd>난바역 짐보관\u003cbr>오사카 난바역 짐보관\u003cbr>난카이난바역 짐보관\u003c/td>\u003ctd>\u003cstrong>1개 이상\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>본문 서브\u003c/td>\u003ctd>난바역 캐리어 보관\u003cbr>난바역 짐보관소\u003cbr>난바역 코인락커\u003c/td>\u003ctd>\u003cstrong>2개 이상\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\u003csection id=\"s6\">\u003cdiv class=\"section-head\">\u003cspan class=\"num\">06\u003c/span>\u003ch2>공정위 이미지 삽입 및 구글맵 리뷰\u003c/h2>\u003c/div>\u003cdiv class=\"note\">\u003cstrong>공정위 이미지 삽입 · 필수\u003c/strong>\u003cp>블로그 포스팅 \u003cstrong>상단 + 하단 모두\u003c/strong> 삽입해주세요.\u003c/p>\u003c/div>\u003cdiv class=\"links\">\u003ca href=\"https://reviewer.flyingjp.com/\" rel=\"noopener\" target=\"_blank\">이미지 안내 페이지 ↗\u003c/a>\u003ca href=\"https://drive.google.com/file/d/1Tc76FWwQmYgcxu9qHMBwBNcsXadI-UTx/view?usp=sharing\" rel=\"noopener\" target=\"_blank\">이미지 다운로드 ↗\u003c/a>\u003c/div>\u003ch3>구글맵 리뷰 작성\u003c/h3>\u003cul>\u003cli>플라잉재팬 여행자센터 구글맵 리뷰\u003c/li>\u003cli>체험 내용 간단 작성\u003c/li>\u003cli>별점은 실제 경험에 따라 솔직하게 평가\u003c/li>\u003c/ul>\u003c/section>\u003csection id=\"s7\">\u003cdiv class=\"section-head\">\u003cspan class=\"num\">07\u003c/span>\u003ch2>작성 시 유의사항\u003c/h2>\u003c/div>\u003cul>\u003cli>\u003cstrong class=\"warn\">복사·붙여넣기 금지\u003c/strong>\u003c/li>\u003cli>\u003cstrong class=\"warn\">허위 후기 작성 금지\u003c/strong>\u003c/li>\u003cli>\u003cstrong class=\"warn\">무단 이미지 사용 금지\u003c/strong> · 직접 촬영한 사진만 사용\u003c/li>\u003c/ul>\u003cp class=\"muted\">작성된 콘텐츠는 플라잉재팬 홍보 목적으로 2차 활용될 수 있습니다.\u003c/p>\u003c/section>\u003c/main>\u003cfooter class=\"footer\">FLYING JAPAN · REVIEWER GUIDE\u003c/footer>\u003c/body>\u003c/html>",

    "body": "## 참여 안내\n이 페이지의 모집 상태와 조건은 디자인 확인용 예시입니다. 실제 참여 조건과 일정은 담당자 안내를 확인해 주세요.\n\n## 가이드 확인 방법\n아래 기존 상세 가이드에서 필수 콘텐츠와 유의사항을 확인해 주세요.",
    "legacyHtml": "\u003c!doctype html>\n\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta content=\"width=device-width,initial-scale=1\" name=\"viewport\">\u003ctitle>FLYING JAPAN | 다이슨 체험단 가이드\u003c/title>\u003cstyle>:root{--navy:#203651;--ink:#243044;--muted:#64748b;--line:#e2e8f0;--soft:#f5f8fc}*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:var(--ink);font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.75}main{max-width:900px;margin:32px auto;background:white;padding:48px 54px;border:1px solid var(--line);border-radius:16px}.brand{font-weight:800;letter-spacing:.15em;color:var(--navy);font-size:13px}h1{font-size:30px;line-height:1.35;margin:10px 0 28px}h2{font-size:21px;margin:42px 0 14px;border-bottom:2px solid var(--navy);padding-bottom:9px;color:var(--navy)}h3{font-size:17px;margin:24px 0 8px;color:var(--navy)}p{margin:8px 0 13px}.notice{background:#edf3fb;border-left:5px solid var(--navy);border-radius:8px;padding:21px 24px}.notice strong{font-size:20px;color:var(--navy)}table{width:100%;border-collapse:collapse;margin:14px 0 20px;font-size:15px}th,td{border:1px solid var(--line);padding:12px 14px;vertical-align:top;text-align:left}th{background:var(--soft);color:var(--navy);font-weight:700;width:30%}ul,ol{padding-left:23px;margin:8px 0 16px}li{margin:5px 0}.tip{background:#f7f9fc;padding:16px 20px;border-radius:9px;border:1px solid var(--line);margin:15px 0}.tag{display:inline-block;background:#e8eef7;color:#203651;border-radius:5px;padding:3px 9px;margin:3px 4px 3px 0;font-weight:600;font-size:14px}a{color:#175db0;overflow-wrap:anywhere}.button{display:inline-block;background:var(--navy);color:white;text-decoration:none;border-radius:7px;padding:10px 18px;font-weight:700;margin:7px 0}footer{border-top:1px solid var(--line);margin-top:44px;padding-top:15px;color:var(--muted);font-size:13px}@media(max-width:640px){main{margin:0;padding:25px 18px;border:0;border-radius:0}h1{font-size:25px}h2{font-size:19px}th,td{padding:10px;font-size:14px}th{width:36%}.notice{padding:17px}}@media print{body{background:white}main{margin:0;border:0;max-width:none}}\u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003cdiv class=\"brand\">FLYING JAPAN · REVIEWER GUIDE\u003c/div>\u003ch1>다이슨 에어랩 체험단 가이드\u003c/h1>\u003csection class=\"notice\">\u003cstrong>체험단 필독\u003c/strong>\u003cp>일본 여행 중 다이슨 제품을 현지에서 대여하고 실제 사용한 경험을 중심으로, 여행자에게 도움이 되는 정보성 후기를 작성해 주세요. 난바 여행자센터의 위치, 대여 과정, 스타일링 사용 후기 및 편의시설을 자연스럽게 소개해 주세요. \u003cbr>한국용 제품과 일본 현지 전압 차이로 인한 불편함, 현지 수령·반납의 편리함을 실제 체험과 연결해 전달해 주세요.\u003c/p>\u003c/section>\u003ch2>1. 콘텐츠 작성 조건\u003c/h2>\u003ctable>\u003ctbody>\u003ctr>\u003cth>원고 분량\u003c/th>\u003ctd>\u003cb>2,000자 이상\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003cth>직접 촬영 사진\u003c/th>\u003ctd>\u003cb>20장 이상\u003c/b> (센터 외관·내부·대여 제품·실제 사용 장면 등)\u003c/td>\u003c/tr>\u003ctr>\u003cth>메인 키워드\u003c/th>\u003ctd>제시된 목록 중 \u003cb>2개 이상\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003cth>서브 키워드\u003c/th>\u003ctd>제시된 목록 중 \u003cb>1개 선택\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003cth>필수 링크\u003c/th>\u003ctd>구글지도 링크, 다이슨 렌탈 예약 링크, 공정위 안내 링크\u003c/td>\u003c/tr>\u003ctr>\u003cth>필수 고지\u003c/th>\u003ctd>공정위 이미지 \u003cb>게시글 상단과 하단\u003c/b> 삽입\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003ch2>2. 콘텐츠 작성 방향\u003c/h2>\u003ch3>① 일본 여행 중 다이슨 사용 문제 소개\u003c/h3>\u003cp>일본은 일반적으로 100V 전원을 사용하며 한국용 220V 다이슨 제품은 전압이 달라 현지에서 바로 사용하기 어렵습니다. 단순 플러그 변환 어댑터로 전압이 바뀌지 않는 점, 변압기 휴대의 번거로움을 여행 준비 경험과 연결해 소개해 주세요.\u003c/p>\u003ch3>② 현지 다이슨 대여의 장점\u003c/h3>\u003cul>\u003cli>난바 여행자센터에서 정품 다이슨 에어랩·드라이어 등 대여\u003c/li>\u003cli>인천공항에서 수령·반납하거나 택배를 주고받을 필요 없이 현지에서 수령 및 반납\u003c/li>\u003cli>여행 기간에 맞춰 사용하고 실제 스타일링 사진과 경험 공유\u003c/li>\u003cli>화이트패스 및 네이버 카페 등급별 다이슨 대여 할인 혜택 소개\u003c/li>\u003c/ul>\u003ch2>3. 필수 포함 내용\u003c/h2>\u003ch3>① 여행자센터 위치 및 접근성\u003c/h3>\u003ctable>\u003ctbody>\u003ctr>\u003cth>장소\u003c/th>\u003ctd>플라잉재팬 난바 여행자센터\u003c/td>\u003c/tr>\u003ctr>\u003cth>접근성\u003c/th>\u003ctd>원본 가이드 기준 난카이 난바역 도보 1분 / 라피트 하차 후 3분\u003c/td>\u003c/tr>\u003ctr>\u003cth>구글지도\u003c/th>\u003ctd>\u003ca href=\"https://maps.app.goo.gl/U6znG4JNz7UrQ4AG9\" rel=\"noopener\" target=\"_blank\">여행자센터 위치 확인\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003ch3>② 대여 서비스 및 절차\u003c/h3>\u003col>\u003cli>여행 일정에 맞춰 사전 예약\u003c/li>\u003cli>여행자센터 방문 및 여권 제시\u003c/li>\u003cli>대여 제품 수령\u003c/li>\u003cli>여행 중 스타일링 기기 사용 및 실제 사용 후기 촬영\u003c/li>\u003cli>안내받은 일정에 맞춰 반납\u003c/li>\u003c/ol>\u003ch3>③ 센터 부가 서비스\u003c/h3>\u003cul>\u003cli>캐리어 짐보관·짐배송 서비스 이용 가능 (짐보관 중 물건 넣기·빼기 가능)\u003c/li>\u003cli>내부 테이블 및 노트북·휴대폰 충전 단자와 케이블\u003c/li>\u003cli>한국인 직원 상주 및 한국어 안내, 여행 정보 제공\u003c/li>\u003cli>센터 내 진행 중인 행사 및 이벤트 안내\u003c/li>\u003c/ul>\u003ch3>④ 화이트패스 및 네이버 카페 할인 혜택\u003c/h3>\u003cul>\u003cli>여행자센터 방문 시 발급 가능한 화이트패스\u003c/li>\u003cli>화이트패스 소지 시 제휴 맛집 할인 등 혜택\u003c/li>\u003cli>플라잉재팬 네이버 카페 가입 후 카페 등급에 따라 다이슨 대여 요금 2000원~5000원 할인 혜택 적용가능\u003c/li>\u003cli>할인 쿠폰은 방문 전에 네이버 카페에서 미리 신청하고, 쿠폰적용하여 할인 가격으로 결제가능\u003c/li>\u003c/ul>\u003cdiv class=\"tip\">\u003cb>※ 화이트패스 촬영 안내\u003c/b>\u003cp>직원이 화이트패스를 안내하지 않았다면 직접 발급을 요청해 주시고, 블로그 후기용으로 화이트패스 카드 사진도 별도로 촬영해 주세요.\u003c/p>\u003c/div>\u003ch3>⑤ 실제 체험 포인트\u003c/h3>\u003cul>\u003cli>무거운 변압기를 한국에서 가져오지 않아도 되는 편리함\u003c/li>\u003cli>오사카 난바 중심지에서 수령·반납하는 편리함\u003c/li>\u003cli>실제 스타일링 결과와 사용 후기 및 직접 촬영 사진\u003c/li>\u003c/ul>\u003ch3>⑥ 렌탈 예약 링크 (필수)\u003c/h3>\u003cp>본문에 \u003cb>‘일본 다이슨 렌탈 예약방법’\u003c/b> 또는 \u003cb>‘일본 다이슨 대여 방법’\u003c/b> 같은 안내 문구를 넣고 아래 URL을 연결해 주세요.\u003c/p>\u003ca class=\"button\" href=\"https://t2m.io/smartdyson\" rel=\"noopener\" target=\"_blank\">다이슨 렌탈 예약 페이지\u003c/a>\u003cp>\u003csmall>https://t2m.io/smartdyson\u003c/small>\u003c/p>\u003ch2>4. 필수 키워드\u003c/h2>\u003ctable>\u003ctbody>\u003ctr>\u003cth>메인 키워드\u003cbr>2개 이상\u003c/th>\u003ctd>\u003cspan class=\"tag\">일본 다이슨 대여\u003c/span>\u003cspan class=\"tag\">일본 다이슨 에어랩 대여\u003c/span>\u003cspan class=\"tag\">일본 에어랩 대여\u003c/span>\u003cspan class=\"tag\">오사카 자유여행\u003c/span>\u003cspan class=\"tag\">오사카 갈만한곳\u003c/span>\u003cspan class=\"tag\">오사카 여행코스\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003cth>서브 키워드\u003cbr>택 1\u003c/th>\u003ctd>\u003cspan class=\"tag\">난바역 다이슨 대여\u003c/span>\u003cspan class=\"tag\">오사카 다이슨 대여\u003c/span>\u003cspan class=\"tag\">다이슨 110v 대여\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003ch2>5. 본문 전개 예시\u003c/h2>\u003col>\u003cli>일본 여행에서 한국용 다이슨 사용 시 전압 차이 문제 소개\u003c/li>\u003cli>변압기 준비의 불편함 설명\u003c/li>\u003cli>난바 여행자센터 위치와 다이슨 대여 소개\u003c/li>\u003cli>대여 과정·실제 사용 후기·센터 내부 시설 소개\u003c/li>\u003cli>화이트패스 혜택 안내\u003c/li>\u003cli>여행자에게 도움이 되는 마무리 추천 멘트\u003c/li>\u003c/ol>\u003ch2>6. 공정위 안내 (필수)\u003c/h2>\u003cdiv class=\"notice\">\u003cstrong>광고·협찬 표시 안내\u003c/strong>\u003cp>포스팅 \u003cb>상단과 하단 모두\u003c/b> 공정위 안내 이미지를 삽입해 주세요. 상단에는 이미지와 함께 아래 체험단 페이지 URL도 기입해 주세요.\u003c/p>\u003cp>\u003ca href=\"https://reviewer.flyingjp.com/\" rel=\"noopener\" target=\"_blank\">https://reviewer.flyingjp.com/\u003c/a>\u003c/p>\u003cp>원본 PDF의 ‘공정위 이미지 다운로드 [클릭]’은 실제 다운로드 URL이 텍스트로 추출되지 않아, 별도 확인 후 연결해야 합니다.\u003c/p>\u003c/div>\u003cfooter>FLYING JAPAN · 다이슨 에어랩 체험단 안내 · 체험단 가이드\u003c/footer>\u003c/main>\n\u003c/body>\u003c/html>",

inline-block;text-decoration:none;border:1px solid #c9d7e6;border-radius:9px;padding:9px 15px;color:#244a74;font-weight:650;margin:5px 8px 5px 0}.link:hover{background:#eff5fc}.note{font-size:14px;color:#64758a;margin-top:9px}.callout{border:1px solid #dce4ee;background:#f6f8fc;border-radius:12px;padding:18px 22px;margin:20px 0}.number{color:#7d94af;font-size:14px;margin-right:8px}.footer{text-align:center;color:#8492a5;font-size:12px;margin-top:30px}@media(max-width:650px){main{padding:0 12px;margin:15px auto 45px}.paper{padding:25px 20px;border-radius:14px}h1{font-size:25px}h2{font-size:21px;margin-top:36px}th,td{padding:12px 11px;font-size:14px}th{width:37%}.notice{padding:18px}}@media print{body{background:white}main{margin:0;max-width:none}.paper{border:0;box-shadow:none;padding:12px}a{color:inherit}}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003carticle class=\"paper\">\u003cdiv class=\"brand\">FLYING JAPAN · REVIEWER GUIDE\u003c/div>\u003ch1>유모차 렌탈 체험단 가이드\u003c/h1>\u003cp class=\"lead\">블로그 콘텐츠 작성 및 필수 안내사항\u003c/p>\n\u003cdiv class=\"notice\">\u003ch2>체험단 필독\u003c/h2>\u003cp>플라잉재팬 여행자센터의 유모차 렌탈 서비스를 실제로 체험한 후, 센터 위치, 대여 방법, 이용 편의성, 여행 중 활용 경험 등을 중심으로 실사용자 관점의 자연스럽고 정보성 있는 후기 콘텐츠를 작성해 주세요.\u003c/p>\u003c/div>\n\u003ch2>\u003cspan class=\"number\">01\u003c/span>콘텐츠 작성 조건\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003ctbody>\u003ctr>\u003cth>본문 글자 수\u003c/th>\u003ctd>2,000자 이상\u003c/td>\u003c/tr>\u003ctr>\u003cth>직접 촬영 사진\u003c/th>\u003ctd>20장 이상\u003cbr/>\u003cspan class=\"note\">센터 외관, 내부, 유모차 대여 장면, 여행 중 사용 모습 등 포함\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003cth>제목 키워드\u003c/th>\u003ctd>필수 키워드 중 1개 이상 포함\u003c/td>\u003c/tr>\u003ctr>\u003cth>본문 키워드\u003c/th>\u003ctd>서브 키워드 중 2개 이상 자연스럽게 삽입\u003c/td>\u003c/tr>\u003ctr>\u003cth>콘텐츠 형식\u003c/th>\u003ctd>체험 중심 후기 + 여행자에게 유용한 정보 제공\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>\u003cspan class=\"number\">02\u003c/span>필수 포함 내용\u003c/h2>\n\u003ch3>① 플라잉재팬 여행자센터 소개\u003c/h3>\u003cul>\u003cli>오사카 에디온 난바 본점 1층\u003c/li>\u003cli>난카이 난바역, 난바역에서 도보 약 3~5분 거리\u003c/li>\u003cli>한국인 여행자를 위한 렌탈 및 여행 지원 서비스 제공\u003c/li>\u003cli>한국어 소통 가능\u003c/li>\u003cli>다이슨 에어랩·에어스트레이트 등 다양한 렌탈상품 및 서비스 운영\u003c/li>\u003cli>센터 내 진행 중인 이벤트 및 프로모션 소개\u003c/li>\u003c/ul>\u003cdiv class=\"callout\">\u003cstrong>안내\u003c/strong> · 렌탈상품 소개 시 USJ 유니버셜 렌탈상품은 제외해 주세요.\u003c/div>\n\u003ch3>② 유모차 렌탈 서비스 이용 후기\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003ctbody>\u003ctr>\u003cth>대여 및 사용 경험\u003c/th>\u003ctd>유모차 대여 과정, 실제 사용 후기, 아이 반응\u003c/td>\u003c/tr>\u003ctr>\u003cth>이용 편의성\u003c/th>\u003ctd>이동 편의성, 접이식 여부, 휴대성\u003c/td>\u003c/tr>\u003ctr>\u003cth>서비스 평가\u003c/th>\u003ctd>유모차 청결 상태, 직원 응대\u003c/td>\u003c/tr>\u003ctr>\u003cth>여행 활용 사례\u003c/th>\u003ctd>오사카 여행 중 실제 활용 경험 및 난바·도톤보리·신사이바시·USJ 등 이동 시 편리했던 점\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>후기 문장 예시\u003c/h3>\u003cdiv class=\"quote\">“아이를 계속 안고 다니기 힘들었는데 유모차 덕분에 훨씬 편하게 여행했어요.”\u003c/div>\u003cdiv class=\"quote\">“여행 중간에 아이가 잠들어도 그대로 이동할 수 있어 정말 편했어요.”\u003c/div>\u003cdiv class=\"quote\">“싸이벡스 유모차는 기본 레인커버가 제공되어 비가 오는 날에도 아이와 함께 편하게 여행할 수 있었어요.”\u003c/div>\u003cp class=\"note\">예시 문구는 참고용이며 실제 경험에 맞게 작성해 주세요.\u003c/p>\n\u003ch3>③ 구글맵 위치 삽입\u003c/h3>\u003cp>블로그 본문에 플라잉재팬 여행자센터 위치를 확인할 수 있는 구글맵을 삽입해 주세요.\u003c/p>\u003ca class=\"link\" href=\"https://maps.app.goo.gl/yeRtzmBTWbH5CiuN9\" rel=\"noopener noreferrer\" target=\"_blank\">구글맵 위치 확인 ↗\u003c/a>\n\u003ch3>④ 후기 및 마무리\u003c/h3>\u003cul>\u003cli>유모차 렌탈 서비스 전반적인 만족도\u003c/li>\u003cli>아이와 여행 시 편리했던 점\u003c/li>\u003cli>오사카 가족여행 시 추천 이유\u003c/li>\u003c/ul>\u003cdiv class=\"quote\">“아이와 함께하는 오사카 여행이라면 꼭 이용해볼 만한 서비스였습니다.”\u003c/div>\u003cdiv class=\"quote\">“유모차 덕분에 여행 중 체력 부담이 많이 줄었어요.”\u003c/div>\n\u003ch2>\u003cspan class=\"number\">03\u003c/span>필수 키워드 안내\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003ctbody>\u003ctr>\u003cth>제목 필수 키워드\u003cbr/>\u003csmall>1개 이상\u003c/small>\u003c/th>\u003ctd>\u003cspan class=\"tag\">오사카 유모차 대여\u003c/span>\u003cspan class=\"tag\">일본 유모차 대여\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003cth>본문 서브 키워드\u003cbr/>\u003csmall>2개 이상\u003c/small>\u003c/th>\u003ctd>\u003cspan class=\"tag\">오사카 유모차 렌탈\u003c/span>\u003cspan class=\"tag\">오사카 아이와 여행\u003c/span>\u003cspan class=\"tag\">일본 아이와 여행\u003c/span>\u003cspan class=\"tag\">일본 가족여행\u003c/span>\u003cspan class=\"tag\">오사카 아이와 가볼만한곳\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>\u003cspan class=\"number\">04\u003c/span>공정위 안내 및 링크 삽입\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003ctbody>\u003ctr>\u003cth>공정위 표시\u003cbr/>\u003csmall>필수\u003c/small>\u003c/th>\u003ctd>블로그 포스팅 상단에 공정위 안내 이미지를 삽입하고 아래 체험단 페이지 URL을 기입해 주세요.\u003cdiv>\u003ca class=\"link\" href=\"https://reviewer.flyingjp.com/\" rel=\"noopener noreferrer\" target=\"_blank\">체험단 페이지 ↗\u003c/a>\u003c/div>\u003c/td>\u003c/tr>\u003ctr>\u003cth>스토어 링크\u003cbr/>\u003csmall>필수\u003c/small>\u003c/th>\u003ctd>블로그에 스토어 링크를 삽입해 주세요.\u003cdiv>\u003ca class=\"link\" href=\"https://t2m.io/storehome\" rel=\"noopener noreferrer\" target=\"_blank\">플라잉재팬 스토어 ↗\u003c/a>\u003c/div>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"note\">원본 PDF의 스토어 링크 항목에는 공정위 이미지 안내 문구가 중복 기재되어 있어, 링크 삽입 위치는 최종 확인이 필요합니다.\u003c/p>\n\u003c/article>\u003cdiv class=\"footer\">FLYING JAPAN · STROLLER RENTAL REVIEWER GUIDE\u003c/div>\u003c/main>\u003c/body>\u003c/html>\n",
